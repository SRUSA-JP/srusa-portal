site_name: SRUSA Portal
site_description: SRUSA の情報をまとめるポータルサイト

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.tabs.sticky
  # 初回は閲覧環境の設定に従い、右上のボタンで切り替えられる
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: ナイトモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替える

extra_css:
  - stylesheets/portal.css
  # viewer/src/config/skins.ts から作られる生成物（npm run build:skins）
  - stylesheets/skins.css

extra_javascript:
  - javascripts/portal.js

plugins:
  - search:
      lang: ja

nav:
  - ホーム: index.md
  - 登山部:
      - 登山部: mountaineering/index.md
      - 活動記録:
          - 大菩薩嶺（2026年7月4日）: mountaineering/活動記録/20260704.md
  - Minecraft: minecraft/index.md
  - 相関図: relationships/index.md

strict: true
